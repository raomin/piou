# ============================================================
#  piou / BirdNET-Go  -- I2S MEMS microphone (INMP441)
#
#  Hardware stream is fixed by the googlevoicehat-soundcard
#  overlay: S32_LE, 48000 Hz, 2 channels.
#  The INMP441 has L/R tied to GND, so only channel 0 (left)
#  carries audio; channel 1 is always silent.
# ============================================================

# --- 1. Raw I2S capture device, addressed by card *name* so a
#        changing card index cannot break it. ---
pcm.i2s_hw {
    type hw
    card "sndrpigooglevoi"
    device 0
}

ctl.i2s_hw {
    type hw
    card "sndrpigooglevoi"
}

# --- 2. Share the single capture stream between several readers
#        (BirdNET-Go plus arecord / the display's level monitor). ---
pcm.i2s_snoop {
    type dsnoop
    ipc_key 3781
    ipc_perm 0666
    slave {
        pcm "i2s_hw"
        format S32_LE
        rate 48000
        channels 2
        period_size 1024
        buffer_size 8192
    }
    bindings.0 0
    bindings.1 1
}

# --- 3. Public device: mono (left channel only), with automatic
#        format/rate conversion for whatever the client asks for.
#        This is the device BirdNET-Go opens. ---
pcm.birdmic {
    type plug
    slave {
        pcm "i2s_snoop"
        channels 2
    }
    # Coefficient doubles as gain: x16 = +24 dB. Applied here, on the 32-bit
    # slave samples, rather than downstream of the S16 conversion -- ambient
    # peaks were only ~30 of 32768 LSB (about 5 usable bits), so amplifying
    # after truncation would scale the quantisation noise with the signal.
    # Ambient peak lands near -35 dBFS, leaving ~35 dB of headroom.
    ttable.0.0 16
    # The hint block is NOT optional: BirdNET-Go enumerates devices through
    # ALSA name hints and cannot select a PCM that has none.
    hint {
        show on
        description "BirdNET I2S MEMS microphone (mono, left channel, +24 dB)"
    }
}

ctl.birdmic {
    type hw
    card "sndrpigooglevoi"
}

# --- 4. Make the I2S mic the system default capture device so
#        tools that ask for "default" get the clean mono stream. ---
pcm.!default {
    type asym
    capture.pcm "birdmic"
    playback.pcm "null"
    hint {
        show on
        description "Default (BirdNET I2S microphone capture)"
    }
}

ctl.!default {
    type hw
    card "sndrpigooglevoi"
}
